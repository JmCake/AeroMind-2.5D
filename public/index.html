<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f1">
    <title>AeroMind · 无人机配送课</title>
    <link rel="icon" href="./aeromind.ico">
    <link rel="stylesheet" href="./guide.css">
  </head>
  <body>
    <header class="mast"><div class="wrap mast-inner">
      <div class="identity"><img src="./aeromind.ico" alt="" width="34" height="34"><strong>AeroMind</strong><span>无人机配送课</span></div>
      <a class="lab-link" href="./lab.html">自由实验 <span aria-hidden="true">↗</span></a>
    </div></header>
    <main class="wrap">
      <section class="assignment" aria-labelledby="lesson-title">
        <div class="brief">
          <div class="lesson-count"><span id="lesson-count">第 1 课 / 共 3 课</span><span class="ticks" aria-hidden="true"><i></i><i></i><i></i></span></div>
          <h1 id="lesson-title">把包裹送到图书馆</h1>
          <p id="instruction" aria-live="polite">点「开始配送」，看无人机怎样认出图书馆的收件柜。</p>
        </div>
        <button id="action" type="button" disabled><span id="action-text">正在准备</span><span class="arrow" aria-hidden="true">→</span></button>
      </section>
      <div class="workbench">
        <section class="card map-card" aria-labelledby="map-heading">
          <div class="card-head"><h2 id="map-heading">配送现场</h2><span class="status" id="flight-state">准备起飞</span></div>
          <div id="city" role="img" aria-label="南港立体城市，显示本课的起点、目的地与实际航迹">
            <div id="pins" aria-hidden="true"></div>
            <div id="aircraft" aria-hidden="true"></div>
          </div>
          <div class="map-footer"><span id="itinerary">物流枢纽 <b aria-hidden="true">→</b> 大学图书馆</span><time id="mission-time" aria-label="本次任务时间">00:00</time></div>
        </section>
        <section class="card vision-card" aria-labelledby="vision-heading">
          <div class="card-head"><h2 id="vision-heading">计算机视觉</h2><span id="source">识别示例</span></div>
          <div class="image-pair" id="image-pair">
            <figure><figcaption>相机原图</figcaption><canvas id="raw" width="192" height="144" role="img" aria-label="机载下视相机的彩色原图"></canvas></figure>
            <figure><figcaption><i class="frame-key" aria-hidden="true"></i>AI 识别图</figcaption><canvas id="detected" width="192" height="144" role="img" aria-label="同一帧上的像素分割和识别框"></canvas></figure>
          </div>
          <div class="readout"><span class="readout-label">读图提示</span><p id="reading">两张图来自同一帧。橙色框标出模型认出的柜标。</p><small id="frame-caption">起飞后切换为机载实时画面</small></div>
        </section>
      </div>
      <nav class="lesson-foot" aria-label="课程翻页"><span id="lesson-name">本课观察 · 视觉签收</span><button id="previous" type="button" hidden>← 上一课</button></nav>
      <p id="fault" role="alert" hidden></p>
      <noscript>请在浏览器中启用 JavaScript 以运行城市和机载相机。</noscript>
    </main>
    <script type="module" src="./guide.js"></script>
  </body>
</html>
